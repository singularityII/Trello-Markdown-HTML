<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://trellocdn.com"></script>
</head>
<body>
<script>
  TrelloPowerUp.initialize({
    'card-back-section': function(t, options) {
      return {
        title: 'Formatted Sheet',
        icon: 'https://flaticon.com',
        content: {
          type: 'iframe',
          url: t.signUrl('./section.html'),
          height: 500
        }
      };
    },
    'card-buttons': function(t, options) {
      return [{
        icon: 'https://flaticon.com',
        text: 'Customize Style',
        callback: function(t) {
          return t.modal({
            title: 'Visual Style & Color Editor',
            url: './editor.html',
            fullscreen: true
          });
        }
      }];
    }
  });
</script>
</body>
</html>
