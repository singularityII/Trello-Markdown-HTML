<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trello Markdown HTML Power-Up</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
  TrelloPowerUp.initialize({
    "card-back-section": function (t) {
      return {
        title: "Formatted Sheet",
        icon: "https://singularityii.github.io/Trello-Markdown-HTML/icon.svg",
        content: {
          type: "iframe",
          url: t.signUrl("./section.html"),
          height: 500
        }
      };
    },

    "card-buttons": function (t) {
      return [{
        icon: "https://singularityii.github.io/Trello-Markdown-HTML/icon.svg",
        text: "Customize Style",
        callback: function (t) {
          return t.modal({
            title: "Visual Style & Color Editor",
            url: "./editor.html",
            fullscreen: true
          });
        }
      }];
    }
  });
</script>
</body>
</html>
