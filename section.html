<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formatted Sheet</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="./parser.js"></script>
  <style>
    html, body {
      min-height: 100%;
      margin: 0;
      background: #181820;
    }
  </style>
</head>
<body>
  <div id="view"></div>

  <script>
    const t = TrelloPowerUp.iframe();
    const view = document.getElementById("view");

    t.render(async function () {
      try {
        const [card, savedTheme] = await Promise.all([
          t.card("desc"),
          t.get("card", "shared", "customTheme")
        ]);

        view.innerHTML = parseTrelloMarkdown(
          (card && card.desc) || "",
          normalizeTheme(savedTheme)
        );

        await t.sizeTo("#view");
      } catch (error) {
        console.error("Unable to render formatted card section:", error);
        view.textContent = "Unable to load the formatted card content.";
      }
    });
  </script>
</body>
</html>
