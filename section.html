<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://trellocdn.com"></script>
  <script src="./parser.js"></script>
</head>
<body style="margin:0;">
  <div id="view"></div>
  <script>
    const t = TrelloPowerUp.iframe();
    t.render(async function() {
      const card = await t.card('desc');
      const savedTheme = await t.get('card', 'shared', 'customTheme');
      document.getElementById('view').innerHTML = parseTrelloMarkdown(card.desc || '', savedTheme || DEFAULT_THEME);
      t.sizeTo('#view');
    });
  </script>
</body>
</html>
